[project]
name = "unity-ml"
version = "0.1.0"
description = ""
authors = [
    {name = "Phillip Vogler",email = "phillip.vogler@fokus.fraunhofer.de"}
]
readme = "README.md"
requires-python = "<=3.10.12,>=3.10.1"
dependencies = [
    "torch (>=2.2.1,<2.3.0)",
    "mlagents-envs (==1.1.0)",
    "mlagents (==1.1.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu121"
priority = "supplemental"


[tool.poetry.dependencies]
torch = {source = "pytorch-cuda"}
