behaviors:
  RoboArm:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048        # Increased to stabilize updates with more variance
      buffer_size: 20480      # Increased to match larger batch_size (keep ratio ~10x)
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5            # Increased from 3 for better data efficiency
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple # Change to 'nature_cnn' if using complex camera images
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000
    time_horizon: 128         # Increased from 64 to capture longer cause-effect chains
    summary_freq: 10000

environment_parameters:
  lesson_number:
    curriculum:
      - name: Lesson1_Reach
        completion_criteria:
          measure: reward
          behavior: RoboArm
          threshold: 1.5
          min_lesson_length: 500  # Increased for stability
          signal_smoothing: true
        value: 0.0

      - name: Lesson2_Grab
        completion_criteria:
          measure: reward
          behavior: RoboArm
          threshold: 2.2
          min_lesson_length: 500  # Increased for stability
          signal_smoothing: true
        value: 1.0

      - name: Lesson3_Place
        completion_criteria:
          measure: reward
          behavior: RoboArm
          threshold: 5.85
          min_lesson_length: 500  # Increased for stability
          signal_smoothing: true
        value: 2.0

      - name: Lesson4_FullTask
        completion_criteria:
          measure: reward
          behavior: RoboArm
          threshold: 7.0
          min_lesson_length: 1000 # Higher requirement for the final task
          signal_smoothing: true
        value: 3.0
